[project]
name = "we-must-pace-the-frontier"
version = "1.0.0"
description = "Open research by Exmergo: did Dario Amodei's essay 'We Must Pace the Frontier' change frontier model releases? Built with Dex."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Exmergo", email = "support@exmergo.com" }]
dependencies = [
    # The Dex engine. Its [duckdb] extra brings dbt-core + dbt-duckdb, [semantic] brings MetricFlow.
    "exmergo-dex-core[duckdb,semantic]==1.13.3",
    "duckdb>=1.1",
    "pyyaml>=6",
]

[tool.uv]
package = false
